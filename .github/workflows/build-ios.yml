name: Build iOS IPA

on:
  push:
    branches: [ main, master, flutter, flutter-ios ]
  pull_request:
    branches: [ main, master, flutter, flutter-ios ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS App (.ipa) with Dynamic Island
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (Release)
        run: flutter build ios --no-codesign --release

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          echo "Verifying Widget Extension in PlugIns:"
          ls -la Payload/Runner.app/PlugIns/TaxiRadarWidget.appex
          zip -r TaxiRadar-1.16.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaxiRadar-iOS-1.16
          path: TaxiRadar-1.16.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/flutter' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: TaxiRadar iOS Build #${{ github.run_number }}
          files: TaxiRadar-1.16.ipa
        continue-on-error: true
